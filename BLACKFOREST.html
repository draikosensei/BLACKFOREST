<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKFOREST</title>

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#050805;color:white;font-family:Arial,sans-serif;
  touch-action:none;
}
canvas{display:block}

#menu{
 position:absolute;inset:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:radial-gradient(circle,#183018,#020402);
 z-index:20;text-align:center;padding:20px;
}
h1{font-size:52px;letter-spacing:8px;margin:5px}
.subtitle{opacity:.8;margin-bottom:20px}
.menuBtn{
 width:260px;padding:15px;margin:6px;border:2px solid #777;
 border-radius:10px;background:#111;color:white;font-size:20px;
}
.menuBtn:active{background:#333}

#hud{
 position:absolute;inset:0;pointer-events:none;display:none;z-index:10;
}
#stats{
 position:absolute;top:12px;left:12px;background:#0009;
 padding:9px;border-radius:8px;font-size:15px;
}
#healthOuter{
 width:190px;height:18px;border:2px solid white;border-radius:8px;
 margin-top:5px;overflow:hidden;
}
#health{height:100%;background:#d22;width:100%}

#crosshair{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 font-size:28px;text-shadow:0 0 5px black;
}

#joystick{
 position:absolute;left:25px;bottom:25px;
 width:145px;height:145px;border-radius:50%;
 background:#ffffff18;border:2px solid #ffffff55;
 pointer-events:auto;
}
#stick{
 position:absolute;left:42px;top:42px;
 width:60px;height:60px;border-radius:50%;
 background:#ffffff55;border:2px solid white;
}

.action{
 position:absolute;width:65px;height:65px;border-radius:50%;
 border:2px solid #ffffffaa;background:#111b;color:white;
 font-size:27px;pointer-events:auto;
}
.action:active{background:#555}

#lookHint{
 position:absolute;right:20px;bottom:25px;
 width:250px;height:180px;pointer-events:auto;
}
#attack{right:35px;bottom:130px}
#axe{right:115px;bottom:55px}
#crouch{right:195px;bottom:130px}
#inventoryBtn{right:35px;top:25px}
#workbenchBtn{right:115px;top:25px}

#inventory{
 position:absolute;inset:0;background:#000b;display:none;
 align-items:center;justify-content:center;z-index:30;
}
#bag{
 width:min(430px,92vw);background:#292929;border:4px solid #888;
 border-radius:12px;padding:15px;
 box-shadow:0 0 30px black;
}
#bag h2{text-align:center;margin:0 0 12px}
#slots{
 display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
}
.slot{
 aspect-ratio:1;border:2px solid #777;background:#151515;
 border-radius:5px;display:flex;align-items:center;
 justify-content:center;flex-direction:column;font-size:24px;
}
.slot span{font-size:12px;color:#ddd}
#closeBag{
 display:block;width:100%;margin-top:12px;padding:10px;
 background:#111;color:white;border:1px solid #aaa;border-radius:7px;
}

#message{
 position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
 background:#000c;padding:10px 18px;border-radius:8px;
 display:none;z-index:40;text-align:center;
}

#teammates{
 position:absolute;right:10px;top:85px;background:#0008;
 padding:8px;border-radius:8px;font-size:13px;
}

#orientation{
 position:absolute;inset:0;background:#050505;color:white;
 display:none;align-items:center;justify-content:center;
 text-align:center;z-index:100;font-size:22px;padding:30px;
}
</style>
</head>

<body>

<div id="orientation">
  🔄<br><br>
  Tourne ton téléphone en <b>paysage</b> pour jouer à BLACKFOREST.
</div>

<div id="menu">
  <h1>BLACKFOREST</h1>
  <div class="subtitle">MISSION FBI — FORÊT 1999</div>
  <div>Agent : <b>Antonin</b></div>
  <br>
  <button class="menuBtn" onclick="startGame()">▶ JOUER</button>
  <button class="menuBtn" onclick="showMessage('Multijoueur : jusqu’à 12 agents.')">👥 MULTIJOUEUR</button>
  <button class="menuBtn" onclick="showMessage('Mode tactile activé. Paysage recommandé.')">⚙ OPTIONS</button>
  <button class="menuBtn" onclick="showMessage('BLACKFOREST — Mission FBI')">© CRÉDITS</button>
</div>

<div id="hud">

  <div id="stats">
    ❤️ <span id="hpText">100</span>/100
    <div id="healthOuter"><div id="health"></div></div>
    🪵 Bois : <span id="woodText">0</span><br>
    ⛓️ Fer : <span id="ironText">0</span><br>
    🏹 Flèches : <span id="arrowText">64</span>
  </div>

  <div id="teammates">
    👥 Équipe FBI<br>
    🟢 Gargamel<br>
    🟢 Buisson<br>
    🟢 Nillo<br>
    🟢 Maïti
  </div>

  <div id="crosshair">+</div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="lookHint"></div>

  <button id="attack" class="action">🏹</button>
  <button id="axe" class="action">🪓</button>
  <button id="crouch" class="action">🥷</button>
  <button id="inventoryBtn" class="action">🎒</button>
  <button id="workbenchBtn" class="action">🛠️</button>
</div>

<div id="inventory">
  <div id="bag">
    <h2>🎒 INVENTAIRE</h2>
    <div id="slots"></div>
    <button id="closeBag">FERMER</button>
  </div>
</div>

<div id="message"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

import {PointerLockControls} from
"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/PointerLockControls.js";

/* =========================
   VARIABLES
========================= */

let scene,camera,renderer;
let clock;
let gameStarted=false;
let crouching=false;
let hp=100;
let arrows=64;
let wood=0;
let iron=0;

let moveX=0,moveY=0;
let joystickPointer=null;

const inventoryItems=[
 {icon:"🪓",name:"Hache",count:1},
 {icon:"🏹",name:"Arbalète",count:1},
 {icon:"🏹",name:"Flèches",count:64},
 {icon:"🪵",name:"Bois",count:0},
 {icon:"⛓️",name:"Fer",count:0}
];

let enemies=[];
let teammates=[];

/* =========================
   MENU / MESSAGE
========================= */

window.showMessage=function(text){
 const m=document.getElementById("message");
 m.textContent=text;
 m.style.display="block";
 clearTimeout(window.msgTimer);
 window.msgTimer=setTimeout(()=>m.style.display="none",2500);
};

window.startGame=function(){
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";
 gameStarted=true;
 init();
};

/* =========================
   THREE.JS
========================= */

function init(){

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x071007);
 scene.fog=new THREE.Fog(0x071007,20,120);

 camera=new THREE.PerspectiveCamera(
   75,innerWidth/innerHeight,.1,300
 );

 camera.position.set(0,2,10);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 const ambient=new THREE.HemisphereLight(0x99aa99,0x111111,1.5);
 scene.add(ambient);

 const light=new THREE.DirectionalLight(0xffffff,1);
 light.position.set(20,30,10);
 scene.add(light);

 createGround();
 createForest();
 createHouses();
 createTeammates();
 createDylan();

 setupTouch();

 animate();
}

/* =========================
   MONDE
========================= */

function createGround(){

 const geo=new THREE.PlaneGeometry(300,300);
 const mat=new THREE.MeshStandardMaterial({color:0x172417});
 const ground=new THREE.Mesh(geo,mat);

 ground.rotation.x=-Math.PI/2;
 scene.add(ground);
}

function createTree(x,z){

 const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.45,.65,5,8),
   new THREE.MeshStandardMaterial({color:0x493522})
 );
 trunk.position.set(x,2.5,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(3.2,7,8),
   new THREE.MeshStandardMaterial({color:0x123d18})
 );
 leaves.position.set(x,7,z);
 scene.add(leaves);
}

function createForest(){

 for(let i=0;i<100;i++){

   const x=(Math.random()-.5)*180;
   const z=(Math.random()-.5)*180;

   if(Math.abs(x)<15 && Math.abs(z)<15) continue;

   createTree(x,z);
 }
}

function createHouses(){

 for(let i=0;i<3;i++){

   const house=new THREE.Mesh(
     new THREE.BoxGeometry(8,5,8),
     new THREE.MeshStandardMaterial({color:0x30251d})
   );

   house.position.set(
     -25+i*25,
     2.5,
     -25
   );

   scene.add(house);

   const roof=new THREE.Mesh(
     new THREE.ConeGeometry(6,3,4),
     new THREE.MeshStandardMaterial({color:0x181818})
   );

   roof.position.set(
     -25+i*25,
     6.5,
     -25
   );

   roof.rotation.y=Math.PI/4;

   scene.add(roof);
 }
}

/* =========================
   COÉQUIPIERS
========================= */

function createTeammates(){

 const names=["Gargamel","Buisson","Nillo","Maïti"];

 names.forEach((name,i)=>{

   const body=new THREE.Mesh(
     new THREE.CapsuleGeometry(.45,1.2,4,8),
     new THREE.MeshStandardMaterial({color:0x253d55})
   );

   body.position.set(
     (i-1.5)*2.5,
     1,
     5
   );

   scene.add(body);

   teammates.push({
     mesh:body,
     name
   });
 });
}

/* =========================
   DYLAN
========================= */

function createDylan(){

 const body=new THREE.Mesh(
   new THREE.CapsuleGeometry(1.1,3,8,16),
   new THREE.MeshStandardMaterial({color:0x171717})
 );

 body.position.set(0,2,-45);
 scene.add(body);

 const head=new THREE.Mesh(
   new THREE.SphereGeometry(1.3,16,16),
   new THREE.MeshStandardMaterial({color:0x222222})
 );

 head.position.set(0,4.8,-45);
 scene.add(head);

 const eyeMat=new THREE.MeshBasicMaterial({color:0xff0000});

 for(const x of [-.4,.4]){

   const eye=new THREE.Mesh(
     new THREE.SphereGeometry(.12,8,8),
     eyeMat
   );

   eye.position.set(x,5,-43.8);
   scene.add(eye);
 }

 enemies.push({
   mesh:body,
   hp:1000
 });
}

/* =========================
   TACTILE
========================= */

function setupTouch(){

 const joy=document.getElementById("joystick");
 const stick=document.getElementById("stick");

 joy.addEventListener("pointerdown",e=>{
   joystickPointer=e.pointerId;
   joy.setPointerCapture(e.pointerId);
   updateJoystick(e);
 });

 joy.addEventListener("pointermove",e=>{
   if(e.pointerId===joystickPointer) updateJoystick(e);
 });

 joy.addEventListener("pointerup",resetJoystick);
 joy.addEventListener("pointercancel",resetJoystick);

 function updateJoystick(e){

   const r=joy.getBoundingClientRect();
   const cx=r.left+r.width/2;
   const cy=r.top+r.height/2;

   let dx=e.clientX-cx;
   let dy=e.clientY-cy;

   const max=45;
   const len=Math.hypot(dx,dy);

   if(len>max){
     dx=dx/len*max;
     dy=dy/len*max;
   }

   stick.style.transform=
     `translate(${dx}px,${dy}px)`;

   moveX=dx/max;
   moveY=dy/max;
 }

 function resetJoystick(){

   joystickPointer=null;
   moveX=0;
   moveY=0;
   stick.style.transform="translate(0,0)";
 }

 /* CAMERA AU DOIGT */

 let lookPointer=null;
 let lastX=0,lastY=0;

 const look=document.getElementById("lookHint");

 look.addEventListener("pointerdown",e=>{
   lookPointer=e.pointerId;
   lastX=e.clientX;
   lastY=e.clientY;
   look.setPointerCapture(e.pointerId);
 });

 look.addEventListener("pointermove",e=>{

   if(e.pointerId!==lookPointer)return;

   const dx=e.clientX-lastX;
   const dy=e.clientY-lastY;

   lastX=e.clientX;
   lastY=e.clientY;

   camera.rotation.y-=dx*.008;
   camera.rotation.x-=dy*.006;

   camera.rotation.x=Math.max(
     -1.3,
     Math.min(1.3,camera.rotation.x)
   );
 });

 look.addEventListener("pointerup",()=>{
   lookPointer=null;
 });

 /* ACCROUPI */

 document.getElementById("crouch").addEventListener("pointerdown",()=>{

   crouching=!crouching;

   document.getElementById("crouch").style.background=
     crouching?"#315531":"#111b";

   showMessage(crouching?
     "🥷 Furtivité activée":
     "Furtivité désactivée");
 });

 /* ARBALÈTE */

 document.getElementById("attack").addEventListener("pointerdown",shoot);

 /* HACHE */

 document.getElementById("axe").addEventListener("pointerdown",useAxe);

 /* INVENTAIRE */

 document.getElementById("inventoryBtn").addEventListener(
   "pointerdown",openInventory
 );

 document.getElementById("closeBag").addEventListener(
   "pointerdown",closeInventory
 );

 /* ÉTABLI */

 document.getElementById("workbenchBtn").addEventListener(
   "pointerdown",craftWorkbench
 );
}

/* =========================
   ACTIONS
========================= */

function shoot(){

 if(arrows<=0){

   showMessage("❌ Plus de flèches !");
   return;
 }

 arrows--;
 updateHUD();

 const ray=new THREE.Raycaster();

 ray.setFromCamera(
   new THREE.Vector2(0,0),
   camera
 );

 const hits=ray.intersectObjects(
   scene.children,
   true
 );

 for(const hit of hits){

   const enemy=enemies.find(e=>
     hit.object===e.mesh ||
     hit.object.parent===e.mesh
   );

   if(enemy){

     const distance=hit.point.distanceTo(
       enemy.mesh.position
     );

     const damage=distance<3?50:30;

     enemy.hp-=damage;

     showMessage(
       "🎯 Dylan : -"+damage+
       " PV ("+Math.max(0,enemy.hp)+"/1000)"
     );

     if(enemy.hp<=0){

       scene.remove(enemy.mesh);
       showMessage("🏆 Dylan neutralisé !");
     }

     break;
   }
 }

}

function useAxe(){

 wood+=1;
 updateHUD();

 showMessage("🪵 +1 bois");
}

function craftWorkbench(){

 if(wood<10){

   showMessage("❌ Il faut 10 bois.");
   return;
 }

 wood-=10;
 updateHUD();

 showMessage("🛠️ Établi fabriqué !");
}

/* =========================
   INVENTAIRE
========================= */

function openInventory(){

 updateInventory();

 document.getElementById("inventory").style.display="flex";
}

function closeInventory(){

 document.getElementById("inventory").style.display="none";
}

function updateInventory(){

 inventoryItems[2].count=arrows;
 inventoryItems[3].count=wood;
 inventoryItems[4].count=iron;

 const slots=document.getElementById("slots");

 slots.innerHTML="";

 for(let i=0;i<15;i++){

   const item=inventoryItems[i];

   const div=document.createElement("div");
   div.className="slot";

   if(item){

     div.innerHTML=
       item.icon+
       `<span>${item.name}</span>`+
       `<span>x${item.count}</span>`;

     div.addEventListener("pointerdown",()=>{
       showMessage(item.name+" sélectionné");
     });

   }

   slots.appendChild(div);
 }
}

/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById("hpText").textContent=hp;
 document.getElementById("health").style.width=hp+"%";

 document.getElementById("woodText").textContent=wood;
 document.getElementById("ironText").textContent=iron;
 document.getElementById("arrowText").textContent=arrows;
}

/* =========================
   DÉPLACEMENT
========================= */

function updatePlayer(){

 if(!gameStarted)return;

 const speed=crouching?.045:.11;

 const forward=new THREE.Vector3();

 camera.getWorldDirection(forward);

 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3()
   .crossVectors(forward,camera.up)
   .normalize();

 camera.position.addScaledVector(
   forward,
   -moveY*speed
 );

 camera.position.addScaledVector(
   right,
   moveX*speed
 );

 camera.position.y=crouching?1.25:2;
}

/* =========================
   ORIENTATION
========================= */

function checkOrientation(){

 const portrait=innerHeight>innerWidth;

 document.getElementById("orientation").style.display=
   portrait && gameStarted?"flex":"none";
}

addEventListener("resize",()=>{

 if(renderer){

   camera.aspect=innerWidth/innerHeight;
   camera.updateProjectionMatrix();

   renderer.setSize(innerWidth,innerHeight);
 }

 checkOrientation();
});

/* =========================
   BOUCLE
========================= */

function animate(){

 requestAnimationFrame(animate);

 updatePlayer();

 renderer.render(scene,camera);
}

</script>

</body>
                      </html>
